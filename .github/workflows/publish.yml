name: publish-nuluca-modeling

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  build-test:
    # This job must never possess an OIDC identity that PyPI could trust.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so a release tag can be checked against main.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test and packaging dependencies
        run: python -m pip install '.[test]'
      - name: Release tags must name a commit on main and match the package version
        if: github.ref_type == 'tag'
        run: |
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version} (expected v${version})." >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Tagged commit ${GITHUB_SHA} is not on main." >&2
            exit 1
          fi
      - name: Release tags must carry the plugin hashes
        if: github.ref_type == 'tag'
        run: python tests/check_plugin_pins.py
      - name: Build the wheel and source distribution
        run: python -m build
      - name: Verify import boundary and inspected archive membership
        run: python -m pytest -q tests
      - name: Record inspected artifact members
        run: |
          python - <<'PY'
          import tarfile, zipfile
          from pathlib import Path
          for artifact in sorted(Path('dist').iterdir()):
              if artifact.suffix == '.whl':
                  with zipfile.ZipFile(artifact) as archive:
                      members = [entry.filename for entry in archive.infolist() if not entry.is_dir()]
              else:
                  with tarfile.open(artifact) as archive:
                      members = [entry.name for entry in archive.getmembers() if entry.isfile()]
              reports = Path('inspection')
              reports.mkdir(exist_ok=True)
              (reports / f'{artifact.name}.members.txt').write_text('\n'.join(members) + '\n')
          PY
      - name: Distributions folder holds exactly one wheel and one source archive
        run: python tests/check_dist_contents.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: nuluca-modeling-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: nuluca-modeling-inspection
          path: inspection/
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: build-test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nuluca-modeling
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuluca-modeling-distributions
          path: dist
      - name: Publish only the inspected wheel and source archive
        run: |
          ls -1 dist
          test "$(ls -1 dist | wc -l)" -eq 2
          test "$(ls -1 dist/*.whl | wc -l)" -eq 1
          test "$(ls -1 dist/*.tar.gz | wc -l)" -eq 1
      - name: Publish the inspected artifacts through PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
